<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fff8f1">
<title>404 – Pip Got Lost | Pip OS</title>
<meta name="description" content="Pip got lost in the clouds. Let's find our way home.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/404.css">
<script>
(function () {
  var root = document.documentElement;
  function read(key) {
    try { return localStorage.getItem('pip:' + key) || ''; }
    catch (e) { return ''; }
  }
  var mode = read('themeMode');
  if (['auto', 'day', 'night'].indexOf(mode) === -1) {
    var legacy = read('theme');
    mode = (legacy === 'day' || legacy === 'night') ? legacy : 'auto';
  }
  var resolved = mode === 'day' || mode === 'night'
    ? mode : ((new Date().getHours() >= 6 && new Date().getHours() < 19) ? 'day' : 'night');
  root.setAttribute('data-theme', read('contrast') === 'on' ? 'contrast' : resolved);
  root.setAttribute('data-theme-mode', mode);
})();
</script>
</head>
<body class="not-found">
<div class="desk" aria-hidden="true"></div>

  <p class="lost-code">ERROR 404 · DREAM NOT FOUND</p>
  <h1>Oops! Pip got lost.</h1>

  <a class="btn btn-primary lost-home" href="./">Take Pip home</a>

</main>
