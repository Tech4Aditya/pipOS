
name: pipOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Code Quality & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: JavaScript Syntax Check
        run: |
          node --check sw.js
          find js -name "*.js" -print0 | xargs -0 -r -n1 node --check

      - name: Run Unit Tests
        run: |
          node --test

      - name: CI Complete
        run: echo "pipOS checks completed successfully."
